name: pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build single-file HTML
        run: python3 tools/build_html.py
      - name: JS tests against the build
        run: |
          set -e
          node -e '
          const fs = require("fs");
          const html = fs.readFileSync("newton-force.html", "utf8");
          const scripts = html.match(/<script>[\s\S]*?<\/script>/g) || [];
          if (!scripts.length) process.exit(1);
          scripts.forEach((s, i) => fs.writeFileSync(".inline" + i + ".js",
            s.replace(/^<script>/, "").replace(/<\/script>$/, "")));
          '
          for f in .inline*.js; do node --check "$f"; done
          rm -f .inline*.js
          node test/rules.test.js
          node test/env.test.js
          node test/serialization.test.js
          node test/board_geometry.test.js
          node test/replay.test.js
          node test/test_web_forward.js
          node test/test_mcts_worker.js
          node test/ai_integration.test.js
      - name: Stage Pages artifact
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site
          cp newton-force.html _site/index.html
          cp newton-force.html _site/newton-force.html
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
